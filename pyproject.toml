[project]
name = "reposcout"
version = "0.1.0"
description = "Hunkestrel localizes Python issues to files and functions with source citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.11.8"]

[build-system]
requires = ["uv_build==0.11.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["integration: requires network access or a slow external resource"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
