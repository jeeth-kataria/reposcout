[project]
name = "reposcout"
version = "0.1.0"
description = "RepoScout localizes Python issues to files and functions with source citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.0.5",
    "openai==1.99.9",
    "pydantic==2.14.2",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "unidiff==0.7.5",
]

[project.optional-dependencies]
dense = ["faiss-cpu==1.12.0", "numpy==2.2.6", "sentence-transformers==5.1.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.11.8"]

[build-system]
requires = ["uv_build==0.11.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["integration: requires network access or a slow external resource"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures/minirepo/postbag/unfinished.py"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
